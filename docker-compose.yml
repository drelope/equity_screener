# Published ports are bound to 127.0.0.1, not 0.0.0.0. `5432:5432` exposes the
# warehouse with a default password to every interface the host has, which on a
# laptop tethered or on a cloud VM is the internet. Put a tunnel in front of
# 127.0.0.1 or change the bind address explicitly if you meant to expose it.
#
# The container still listens on 0.0.0.0 inside itself -- that is what makes the
# published port reachable and what lets the services talk to each other.
x-db-url: &db-url "postgresql+psycopg://dividend:${POSTGRES_PASSWORD:-dividend}@postgres:5432/dividend"

services:
  postgres:
    # Pin a specific minor release to an immutable digest for reproducibility.
    # Resolve with: docker buildx imagetools inspect postgres:17.11
    image: postgres:17.11@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
    command:
      - "postgres"
      # Warehouse tuning for 11 GB on NVMe; the shipped defaults are sized for
      # a spinning disk (shared_buffers 128 MB, work_mem 4 MB, random_page_cost
      # 4, checkpoint every 5 min). pg_stat_statements stays loaded -- it is
      # what makes a slow stage attributable. log_lock_waits=1s makes a queued
      # DDL statement name its blocker in the journal instead of waiting
      # silently for ~43 min, as the raw stage did on three consecutive runs.
      # Waits longer than deadlock_timeout (1 s) are what gets logged.
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=1GB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "checkpoint_timeout=15min"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "log_lock_waits=on"
    environment:
      POSTGRES_DB: dividend
      POSTGRES_USER: dividend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dividend}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    # Parallel hash/sort segments live in /dev/shm, whose default is 64 MB --
    # one 32 MB work_mem per participant would overflow it. 512 MB is ample
    # for the default parallelism (2 workers + leader).
    shm_size: 512m
    # Cap so postgres and a peak-memory ETL stage can never jointly exceed the
    # 24 GB WSL2 VM (.wslconfig); at the old 15.3 GB default that arithmetic is
    # what wedged the Oct 7 run. File cache
    # is reclaimed before anon pages, so the cap costs cache under pressure
    # rather than an OOM kill.
    mem_limit: 10g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dividend -d dividend"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  migrate:
    build: .
    command: ["python", "-m", "scripts.migrate"]
    environment:
      DATABASE_URL: *db-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  streamlit:
    build: .
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      DATABASE_URL: *db-url
      # Operator controls (queue, schedule, cancel, call the API) are off unless this is
      # set to at least 12 characters. Empty means a read-only app, never a default login.
      OPS_ADMIN_TOKEN: ${OPS_ADMIN_TOKEN:-}
      # Integrations page. Both are optional: without them the page reports the API as
      # unreachable or the key as missing instead of failing.
      API_BASE_URL: http://api:8000
      API_KEY: ${API_KEY:-}
    ports:
      - "127.0.0.1:8501:8501"
    # Streamlit serves /_stcore/health once the app is up. The operator token gates the
    # controls, not the data, so the app is still not meant to face a network: it stays
    # on the loopback.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # service_completed_successfully, not just service_healthy: postgres being
    # up says nothing about the schema existing. Without this the app and API
    # race the migration and fail on the first missing table.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: *db-url
      API_KEY: ${API_KEY:?Set API_KEY before starting the API}
    ports:
      - "127.0.0.1:8000:8000"
    # /health is public by design -- it is the unauthenticated liveness probe,
    # so it must not become an auth bypass by proxying anything.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Runs the tasks queued from the web app's Operations page, and queues its schedules.
  # It executes only the commands in src/crispdm/ops/catalog.py. The nightly ETL is NOT
  # scheduled here: it still runs from the host's systemd timer (ops/systemd). Tasks that
  # take the pipeline lock cannot overlap it.
  worker:
    build: .
    command: ["python", "-m", "scripts.ops_worker"]
    environment:
      DATABASE_URL: *db-url
      SEC_USER_AGENT: ${SEC_USER_AGENT:-Your Name your.email@example.com}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # On stop the worker terminates a running task (up to 15s) and records it as failed.
    stop_grace_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
