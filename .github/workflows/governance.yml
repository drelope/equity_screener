name: Governance Validation

on:
  pull_request:
    branches:
      - main
      - master

  push:
    branches:
      - main
      - master
      - fix/**
      - feat/**
      - feature/**

permissions:
  contents: read

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:

    name: Governance Validation

    runs-on: ubuntu-latest

    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install governance dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Verify required directories
        run: |
          set -euo pipefail

          test -d docs/evidence
          test -d docs/evidence/ci
          test -d docs/evidence/attestations
          test -d scripts
          test -d tests

      - name: Verify required evidence files
        run: |
          set -euo pipefail

          test -f docs/evidence/README.md
          test -f docs/evidence/m1.md
          test -f docs/evidence/Prompt_M1approval.md
          test -f docs/evidence/audit-checklist.md
          test -f docs/evidence/ci/m1-ci-evidence.md
          test -f docs/evidence/attestations/m1-attestation.md

          test -f scripts/validate_m1_evidence.py
          test -f tests/test_validate_m1_evidence.py

      - name: Display evidence inventory
        run: |
          set -euo pipefail

          echo "Evidence files:"
          find docs/evidence -type f | sort

      - name: Python syntax check
        run: |
          set -euo pipefail

          python -m py_compile scripts/validate_m1_evidence.py

      - name: Run validator tests
        run: |
          set -euo pipefail

          pytest tests/test_validate_m1_evidence.py -q

      - name: Run governance validator
        run: |
          set -euo pipefail

          python scripts/validate_m1_evidence.py

      - name: Validate workflow YAML
        run: |
          set -euo pipefail

          python - <<'PY'
          import yaml
          from pathlib import Path

          workflows = Path(".github/workflows")

          for file in workflows.glob("*.y*ml"):
              with open(file, "r", encoding="utf-8") as f:
                  yaml.safe_load(f)

          print("Workflow YAML validation passed")
          PY

      - name: Install markdownlint
        run: |
          set -euo pipefail

          npm install -g markdownlint-cli

      - name: Markdown advisory check
        continue-on-error: true
        run: |
          markdownlint docs/**/*.md > markdownlint.log 2>&1 || true

      - name: Generate validation report
        if: always()
        run: |
          {
            echo "# Governance Validation Report"
            echo
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Ref: $GITHUB_REF"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "Validation completed."
          } > governance-report.txt

      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-report
          path: governance-report.txt

      - name: Upload markdown report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdownlint-report
          path: markdownlint.log