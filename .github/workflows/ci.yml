name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.lock.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    # A real warehouse, so the ~20 DB-gated test modules run instead of
    # silently skipping (which is what happened with no service here).
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: dividend
          POSTGRES_USER: dividend
          POSTGRES_PASSWORD: dividend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dividend -d dividend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://dividend:dividend@localhost:5432/dividend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.lock.txt
      - name: Create and migrate the warehouse schema
        run: |
          python -m scripts.init_db
          python -m scripts.migrate
      - run: python -m pytest -q

  security:
    name: Security (dependency audit + secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.lock.txt
      - name: Audit dependencies for known CVEs
        run: pip-audit -r requirements.lock.txt
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reproducibility:
    name: Reproducibility lock scaffolding (RM-06/DEC-008 draft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check lock artifacts (scaffolding)
        run: python scripts/check_reproducibility_locks.py
      - name: Validate dev lock resolves (dry-run, non-enforcing)
        continue-on-error: true
        run: pip install --dry-run -r requirements-dev.lock.txt

  evidence-closeout:
    name: Evidence closeout (draft, non-promotion gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate evidence bundle (draft, not promotion-grade)
        run: python scripts/check_evidence_closeout.py

  reproducibility-gaps:
    name: Reproducibility enforcement gaps (RM-06/DEC-008 draft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Report lock-enforcement gaps (draft, non-enforcing)
        run: python scripts/check_reproducibility_enforcement.py


  p0-regression-gates:
    name: P0 regression gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.lock.txt
      - name: PIT and determinism guards
        run: python -m pytest tests/test_pit_guards.py tests/test_run_manifest.py -q
      - name: Artifact contract and promotion gap guards
        run: python -m pytest tests/test_backtest.py tests/test_check_promotion_evidence.py tests/test_promotion_contract.py -q
      - name: Advertised dry-run guard
        run: python -m pytest tests/test_dry_run_walk_forward.py -q
      - name: Clean-environment lock identity parity
        run: python scripts/check_clean_environment_parity.py
